name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project zip (first run only)
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -n1 || true)
          if [ -n "$ZIP" ]; then
            rm -rf /tmp/unz && mkdir /tmp/unz
            unzip -q "$ZIP" -d /tmp/unz
            SRC=$(dirname "$(find /tmp/unz -name settings.gradle.kts | head -n1)")
            rm -rf "$SRC/.github"
            cp -a "$SRC"/. .
            rm "$ZIP"
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add -A
            git commit -m "Unpack project files"
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ChapterSplitter.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ChapterSplitter-APK
          path: ChapterSplitter.apk

      - name: Publish release (only on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ChapterSplitter.apk
